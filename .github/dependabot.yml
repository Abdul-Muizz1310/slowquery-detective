version: 2
updates:
  # Pin-bump the actions used by ci.yml / publish.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # Python dependencies resolved from pyproject.toml into uv.lock. CI runs
  # `uv sync --frozen`, so the lockfile has to move with the manifest.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    groups:
      # One PR for the patch/minor churn, so the review queue stays readable;
      # majors still arrive individually because they need a real look.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
